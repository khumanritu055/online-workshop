<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Workshop Registration</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<section class="demo-wrapper">
  <div class="demo-card">
    <h2>Workshop Registration</h2>
    
    <p class="sub-text">Please fill the form to register</p>

    <form action="register" method="POST">

      <div class="input-box">
        <input type="text" name="name" required placeholder=" ">
        <label>Full Name</label>
      </div>

      <div class="input-box">
        <input type="email" name="email" required placeholder=" ">
        <label>Email Address</label>
      </div>

      <div class="input-box">
        <input type="tel" name="phone" required placeholder=" ">
        <label>Mobile Number</label>
      </div>

      

<input type="hidden" name="course" id="course">


      <button type="submit" class="demo-btn">REGISTER</button>

    </form>

  </div>
</section>
<script>

const params = new URLSearchParams(window.location.search);

const workshop = params.get("workshop");

document.getElementById("course").value = workshop;

</script>
</body>
</html>
